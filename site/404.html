*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:16px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--rust);color:#fff;box-shadow:0 6px 18px rgba(185,88,60,.35)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.small{font-size:14px;color:var(--muted);margin-top:14px}
.shot{margin:44px auto 0;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(43,29,22,.25),0 0 0 1px var(--line)}
video{max-width:100%;height:auto;display:block;background:#5cc4c0}
section{padding:72px 0}
h2{font-size:clamp(28px,4vw,40px);margin:0 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 36px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.split img{border-radius:14px;box-shadow:0 20px 50px rgba(43,29,22,.2)}
.band{background:var(--cream-2)}

.plan{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column}
.plan.pro{border:2px solid var(--rust);position:relative}
.plan.pro .tag{position:absolute;top:-13px;right:22px;background:var(--rust);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
.plan h3{margin:0;font-size:22px}
.price{font-size:42px;font-weight:800;margin:8px 0 2px}

.plan ul{list-style:none;padding:0;margin:18px 0 24px;flex:1}
.plan li{padding:7px 0 7px 28px;position:relative;font-size:15px;border-bottom:1px dashed var(--line)}
.plan li:last-child{border-bottom:0}
.plan li::before{content:"";position:absolute;left:4px;top:13px;width:12px;height:7px;border-left:2.5px solid var(--rust);border-bottom:2.5px solid var(--rust);transform:rotate(-45deg)}
.plan .btn{justify-content:center}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:10px}
.faq summary{font-weight:600;cursor:pointer}
.faq p{color:var(--muted);margin:10px 0 0}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px;text-align:center}
